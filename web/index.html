<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    ProofLens Web Application
    GPS Camera • Location • Evidence
  -->

  <base href="$FLUTTER_BASE_HREF">

  <!-- Basic metadata -->
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  >

  <meta
    name="description"
    content="ProofLens — GPS camera and location evidence application."
  >

  <meta
    name="theme-color"
    content="#0B6DFF"
  >

  <!-- Prevent unwanted browser behavior on mobile -->
  <meta name="mobile-web-app-capable" content="yes">

  <!-- Android / Chrome -->
  <meta name="mobile-web-app-title" content="ProofLens">

  <!-- iOS -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >
  <meta
    name="apple-mobile-web-app-title"
    content="ProofLens"
  >

  <!-- =========================================
       PROOFLENS APP ICONS
       ========================================= -->

  <!-- Browser favicon -->
  <link
    rel="icon"
    type="image/png"
    sizes="512x512"
    href="icons/Icon-512.png"
  >

  <!-- Smaller favicon fallback -->
  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="icons/Icon-192.png"
  >

  <!-- Apple / iPhone / iPad -->
  <link
    rel="apple-touch-icon"
    sizes="192x192"
    href="icons/Icon-192.png"
  >

  <link
    rel="apple-touch-icon"
    sizes="512x512"
    href="icons/Icon-512.png"
  >

  <!-- PWA manifest -->
  <link
    rel="manifest"
    href="manifest.json"
  >

  <!-- Application title -->
  <title>ProofLens</title>
</head>

<body>

  <!--
    Flutter Web Application
  -->

  <script
    src="flutter_bootstrap.js"
    async
  ></script>

</body>
</html>
